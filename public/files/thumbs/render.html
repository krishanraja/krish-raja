<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;font-family:'Onest',sans-serif}
.t{position:relative;width:1280px;height:720px;overflow:hidden}
.kick{font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.serif{font-family:'Instrument Serif',serif}
img.cut{position:absolute;bottom:0;filter:grayscale(1) contrast(1.08)}

/* conversation */
.conv{padding:64px 0 0 72px}
.conv .kick{opacity:.7}
.conv .name{margin-top:34px;font-size:118px;font-weight:700;line-height:.88;letter-spacing:-.04em}
.conv .role{margin-top:22px;font-size:24px;font-weight:500;opacity:.75}
.conv .topic{position:absolute!important;left:72px;bottom:60px;width:500px;font-size:42px;line-height:1.05}
.conv .disc{position:absolute;right:90px;bottom:-200px;width:600px;height:600px;border-radius:50%}
.conv img.cut{right:0;height:470px;max-width:740px;object-fit:contain;object-position:right bottom}
.conv .topic,.conv .name,.conv .role,.conv .kick{position:relative;z-index:2}

/* event */
.event .word{position:absolute;left:56px;top:44px;font-size:132px;font-weight:800;letter-spacing:-.05em;line-height:.85}
.event .day{position:absolute;left:64px;bottom:140px;display:flex;align-items:baseline;gap:18px}
.event .day b{font-size:220px;font-weight:800;line-height:.75;letter-spacing:-.06em}
.event .day span{font-size:30px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.event .topic{position:absolute;left:72px;bottom:52px;width:450px;font-size:34px;line-height:1.08}
.event img.cut{right:0;height:380px;max-width:740px;object-fit:contain;object-position:right bottom}
.event .with{position:absolute;left:64px;top:330px;font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}

/* stage */
.stage .ph{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.1) brightness(.9)}
.stage .tint{position:absolute;inset:0;mix-blend-mode:multiply}
.stage .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.1) 60%,transparent)}
.stage .chip{position:absolute;left:64px;top:56px;padding:12px 22px;border-radius:999px;font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.stage .headline{position:absolute;left:64px;right:64px;bottom:60px;color:#fff;font-size:76px;font-weight:700;line-height:.95;letter-spacing:-.03em}

/* keynote */
.keynote{padding:64px 72px}
.keynote .venue{margin-top:28px;font-size:84px;font-weight:700;line-height:.92;letter-spacing:-.035em;width:760px}
.keynote .quote{position:absolute;left:72px;bottom:70px;width:700px;font-size:46px;line-height:1.05}
.keynote .yr{position:absolute;right:40px;top:40px;z-index:2;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:700;border:3px solid currentColor}
.keynote img.cut{right:30px;height:560px}
.keynote .bar{position:absolute;right:0;top:0;bottom:0;width:440px}
</style></head>
<body><div id="t"></div>
<script>
const D = {
  conv: ({kick,first,last,role,topic,bg,fg,disc,img}) => `<div class="t conv" style="background:${bg};color:${fg}"><div class="disc" style="background:${disc}"></div><img class="cut" src="${img}"><p class="kick">${kick}</p><p class="name">${first}<br>${last}</p><p class="role">${role}</p><p class="topic serif">${topic}</p></div>`,
  event: ({word,day,topic,bg,fg,acc,img,stroke}) => `<div class="t event" style="background:${bg};color:${fg}"><p class="word" style="${stroke?`-webkit-text-stroke:2px ${acc};color:transparent`:`color:${acc}`}">${word}</p><p class="with">With Rio Longacre &amp; Brett House</p><img class="cut" src="${img}"><div class="day"><span>Day</span><b style="color:${acc}">${day}</b></div><p class="topic serif">${topic}</p></div>`,
  stage: ({chip,headline,img,tint,chipbg,chipfg,pos}) => `<div class="t stage"><div class="ph" style="background-image:url(${img});background-position:${pos||'center'}"></div><div class="tint" style="background:${tint}"></div><div class="shade"></div><p class="chip" style="background:${chipbg};color:${chipfg}">${chip}</p><p class="headline">${headline}</p></div>`,
  keynote: ({kick,venue,quote,yr,bg,fg,bar,img,yc,noq}) => `<div class="t keynote" style="background:${bg};color:${fg}"><div class="bar" style="background:${bar}"></div><img class="cut" src="${img||'krish.png'}"><p class="kick" style="opacity:.7">${kick}</p><p class="venue">${venue}</p><div class="yr" style="color:${yc}">${yr}</div><p class="quote serif">${noq?quote:`&ldquo;${quote}&rdquo;`}</p></div>`,
};
const item = JSON.parse(new URLSearchParams(location.search).get('d'));
document.getElementById('t').innerHTML = D[item.tpl](item);
</script></body></html>
